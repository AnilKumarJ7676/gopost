name: Engine CI

on:
  push:
    branches: [main, master]
    paths: ['gopost_app/native/**']
  pull_request:
    branches: [main, master]
    paths: ['gopost_app/native/**']

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-tidy libgtest-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake googletest llvm

      - name: Run clang-tidy
        if: runner.os != 'Windows'
        working-directory: gopost_app/native
        run: |
          cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_TESTS=ON
          if command -v clang-tidy &> /dev/null; then
            clang-tidy gopost_core/src/gpu/*.cpp -- -I gopost_core/include
          fi
        continue-on-error: true

      - name: Build (Unix)
        if: runner.os != 'Windows'
        working-directory: gopost_app/native
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON -DBUILD_GMOCK=ON
          cmake --build build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: gopost_app/native
        run: |
          cmake -B build -DBUILD_TESTS=ON -DBUILD_GMOCK=ON
          cmake --build build --config Debug

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        working-directory: gopost_app/native/build
        run: ctest --output-on-failure

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: gopost_app/native/build
        run: ctest -C Debug --output-on-failure
