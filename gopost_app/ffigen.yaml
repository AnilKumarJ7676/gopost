name: GopostEngineBindings
description: Auto-generated FFI bindings for the gopost_engine C API.
output: 'lib/rendering_bridge/ffi/generated_bindings.dart'

headers:
  entry-points:
    - 'native/gopost_core/include/gopost/engine.h'
    - 'native/gopost_core/include/gopost/error.h'
    - 'native/gopost_core/include/gopost/types.h'
    - 'native/gopost_core/include/gopost/crypto.h'
    - 'native/gopost_core/include/gopost/gpu_context.h'
    - 'native/gopost_core/include/gopost/template_parser.h'
    - 'native/gopost_core/include/gopost/image_codec.h'
    - 'native/gopost_image_engine/include/gopost/canvas.h'
    - 'native/gopost_image_engine/include/gopost/effects.h'
    - 'native/gopost_image_engine/include/gopost/text_engine.h'
    - 'native/gopost_image_engine/include/gopost/export.h'
    - 'native/gopost_image_engine/include/gopost/mask.h'
    - 'native/gopost_image_engine/include/gopost/project.h'
  include-directives:
    - 'native/gopost_core/include/gopost/engine.h'
    - 'native/gopost_core/include/gopost/error.h'
    - 'native/gopost_core/include/gopost/types.h'
    - 'native/gopost_core/include/gopost/crypto.h'
    - 'native/gopost_core/include/gopost/gpu_context.h'
    - 'native/gopost_core/include/gopost/template_parser.h'
    - 'native/gopost_core/include/gopost/image_codec.h'
    - 'native/gopost_image_engine/include/gopost/canvas.h'
    - 'native/gopost_image_engine/include/gopost/effects.h'
    - 'native/gopost_image_engine/include/gopost/text_engine.h'
    - 'native/gopost_image_engine/include/gopost/export.h'
    - 'native/gopost_image_engine/include/gopost/mask.h'
    - 'native/gopost_image_engine/include/gopost/project.h'

compiler-opts:
  - '-Inative/gopost_core/include'
  - '-Inative/gopost_image_engine/include'

preamble: |
  // AUTO-GENERATED by ffigen — do not edit manually.
  // Regenerate with: dart run ffigen --config ffigen.yaml

functions:
  include:
    - 'gopost_.*'
  rename:
    'gopost_(.*)': '$1'

structs:
  include:
    - 'Gopost.*'
  rename:
    'Gopost(.*)': '$1'

enums:
  include:
    - 'Gopost.*'
  rename:
    'Gopost(.*)': '$1'

typedefs:
  include:
    - 'Gopost.*'

type-map:
  typedefs:
    'size_t':
      lib: 'ffi'
      c-type: 'Size'
      dart-type: 'int'

silence-enum-warning: true

comments:
  style: any
  length: full
